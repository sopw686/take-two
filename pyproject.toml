[project]
name = "take-two"
version = "0.1.0"
description = "Take Two: an intent-based rehearsal coach for science talks."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=1.26",
    "soundfile>=0.12",
    "faster-whisper>=1.1.0",
    "anthropic>=1.0",
    "praat-parselmouth>=0.4.5",  # pitch for Improvise (and the emphasis check)
]

[project.optional-dependencies]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9.0,<10"]
cloud = ["openai>=1.40"]
emphasis = ["praat-parselmouth>=0.4.5"]
fixtures = ["pyttsx3>=2.90", "librosa>=0.10"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyttsx3>=2.90",
    "librosa>=0.10",
    "praat-parselmouth>=0.4.5",
    "playwright>=1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: runs real local speech-to-text on fixtures",
    "browser: drives Chrome with a fake microphone against a live server (uv run pytest -m browser)",
]
addopts = "-m 'not slow and not browser'"

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["take_two"]
